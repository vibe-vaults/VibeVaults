name: Playwright Tests
# Runs on pull requests only. A post-merge run on main was dropped on purpose:
# main only ever receives dev through a PR that already had to pass this
# suite, and production is gated by deploy.yml, not by this workflow, so the
# extra run tested the same tree a second time and blocked nothing.
on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci

    # Cache the Playwright browser binary across runs. Without this, every CI
    # run re-downloads ~170MB from cdn.playwright.dev — which intermittently
    # hangs (see https://github.com/microsoft/playwright/issues/40998).
    # Key on the playwright version so a bump invalidates the cache automatically.
    - name: Get installed Playwright version
      id: playwright-version
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright Browsers (cache miss)
      # CI only runs the chromium project (see playwright.config.ts).
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium

    - name: Install Playwright system deps (cache hit)
      # System libs (libnss3 etc.) live in /usr/lib, not in the cached path,
      # so they must be reinstalled every run. install-deps does only that.
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: 2.101.0

    # supabase/signing_keys.json is git-ignored (it is a private key), but
    # config.toml points at it and `supabase start` aborts without it. The MCP
    # OAuth server needs an asymmetric signing key, so mint a throwaway ES256
    # one per run. Plain node crypto, so it does not depend on the CLI version.
    - name: Generate local JWT signing key
      run: |
        node -e "
        const { generateKeyPairSync, randomUUID } = require('crypto');
        const jwk = generateKeyPairSync('ec', { namedCurve: 'P-256' }).privateKey.export({ format: 'jwk' });
        const key = { ...jwk, kid: randomUUID(), use: 'sig', key_ops: ['sign', 'verify'], alg: 'ES256', ext: true };
        require('fs').writeFileSync('supabase/signing_keys.json', JSON.stringify([key]));
        "

    - name: Start Supabase
      run: supabase start

    - name: Get Supabase Local Keys
      id: supabase_keys
      run: |
        # Wait for Supabase Auth to accept GET requests.
        # NOTE: --head (HEAD) is intentionally NOT used — GoTrue returns 405 for HEAD,
        # which makes curl --fail exit non-zero even when the service is fully running.
        echo "Waiting for Supabase Auth to be ready..."
        count=0
        until curl -sf http://127.0.0.1:54321/auth/v1/health > /dev/null; do
          if [ $count -ge 150 ]; then
            echo "ERROR: Supabase Auth did not become ready after 5 minutes."
            supabase status || true
            exit 1
          fi
          echo "  Still waiting... ($((count * 2))s elapsed)"
          sleep 2
          count=$((count + 1))
        done
        echo "Supabase Auth is ready."

        # Extract keys via JSON output — redirect stderr so CLI warnings don't corrupt the JSON
        STATUS_JSON=$(supabase status --output json 2>/dev/null)
        ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // .anon_key // empty')
        SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // .service_role_key // empty')

        if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
          echo "ERROR: Failed to extract Supabase keys. JSON output was:"
          echo "$STATUS_JSON"
          exit 1
        fi

        echo "anon_key=${ANON_KEY}" >> $GITHUB_OUTPUT
        echo "service_role_key=${SERVICE_ROLE_KEY}" >> $GITHUB_OUTPUT

    - name: Run Playwright tests
      run: npx playwright test
      env:
        NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase_keys.outputs.anon_key }}
        SUPABASE_SECRET_KEY: ${{ steps.supabase_keys.outputs.service_role_key }}
        STRIPE_SECRET_KEY: "sk_test_dummy"
        STRIPE_WEBHOOK_SECRET: "whsec_dummy"
        STRIPE_PRODUCT_STARTER: "prod_dummy_starter"
        STRIPE_PRICE_STARTER_MONTHLY: "price_dummy_starter_monthly"
        STRIPE_PRICE_STARTER_YEARLY: "price_dummy_starter_yearly"
        STRIPE_PRODUCT_PRO: "prod_dummy_pro"
        STRIPE_PRICE_PRO_MONTHLY: "price_dummy_pro_monthly"
        STRIPE_PRICE_PRO_YEARLY: "price_dummy_pro_yearly"
        STRIPE_PRODUCT_BUSINESS: "prod_dummy_business"
        STRIPE_PRICE_BUSINESS_MONTHLY: "price_dummy_business_monthly"
        STRIPE_PRICE_BUSINESS_YEARLY: "price_dummy_business_yearly"
        RESEND_API_KEY: "re_dummy"
        NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
