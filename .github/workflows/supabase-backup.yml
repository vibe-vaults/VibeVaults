# Main Responsibility:
#   Nightly logical backup of the production Supabase database, pushed to the
#   PRIVATE repo vibe-vaults/VibeVaults-backups.
#
# Sensitive Dependencies:
#   - The dump contains personal data (auth.users, auth.sessions, feedback
#     content). This repo is public, so the dump MUST NOT be uploaded as a
#     workflow artifact: artifacts on a public repo are readable by anyone with
#     read access to it. Push to the private backup repo instead.
#   - Auth to the backup repo is a write-scoped DEPLOY KEY (secret
#     BACKUP_REPO_SSH_KEY), not a PAT, so it can touch nothing else.
#   - Each run force-pushes a single orphan commit. History therefore never
#     accumulates: a pruned backup is genuinely gone, which is what our stated
#     retention period requires.
#   - Every dump is age-encrypted on the runner before it leaves it, to the
#     public key in secret BACKUP_AGE_RECIPIENT. The private key never touches
#     GitHub: it lives offline with the operator, and losing it makes every
#     backup unrestorable. The job fails closed (no dump at all) if the
#     recipient is missing, so a plaintext archive can never be pushed.
#   - scripts/restore-prod-snapshot.sh reads from this repo. Changing the path
#     layout or retention here breaks that script.

name: Backup Supabase Database

on:
  schedule:
    - cron: '0 0 * * *' # Midnight every day
  workflow_dispatch:

concurrency:
  group: supabase-backup
  cancel-in-progress: false

env:
  BACKUP_REPO: vibe-vaults/VibeVaults-backups
  RETENTION: 30 # how many nightly backups to keep

jobs:
  backup:
    name: Backup Supabase Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Install age
        run: sudo apt-get install -y -qq age

      - name: Run Database Dump
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          # Fail closed: without a recipient we must not even produce a dump.
          [[ "$BACKUP_AGE_RECIPIENT" == age1* ]] || { echo "BACKUP_AGE_RECIPIENT secret is missing or not an age public key"; exit 1; }
          mkdir -p backups
          supabase link --project-ref "$PROJECT_ID" --password "$DB_PASSWORD"
          supabase db dump --password "$DB_PASSWORD" --role-only -f backups/roles.sql
          supabase db dump --password "$DB_PASSWORD" -f backups/schema.sql
          supabase db dump --password "$DB_PASSWORD" --data-only -f backups/data.sql
          # Tar straight into age, so no unencrypted archive is ever written.
          tar -czf - backups/ | age -r "$BACKUP_AGE_RECIPIENT" -o "supabase_backup_$(date -u +%Y%m%d_%H%M%S).tar.gz.age"
          rm -rf backups/
          ls -lh supabase_backup_*.tar.gz.age

      - name: Configure SSH for backup repo
        env:
          BACKUP_REPO_SSH_KEY: ${{ secrets.BACKUP_REPO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BACKUP_REPO_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Push backup to private repo
        env:
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/backup-repo
          cd /tmp/backup-repo
          git init -q -b main
          git remote add origin "git@github.com:${BACKUP_REPO}.git"
          # Shallow-fetch whatever is already there so we can prune against it.
          git fetch -q --depth=1 origin main 2>/dev/null \
            && git checkout -q -f -b main origin/main \
            || echo "backup repo is empty, starting fresh"

          mkdir -p daily
          cp "$GITHUB_WORKSPACE"/supabase_backup_*.tar.gz.age daily/

          # One-time migration: encrypt backups pushed before encryption existed,
          # so the retention window is kept instead of being thrown away.
          shopt -s nullglob
          for legacy in daily/supabase_backup_*.tar.gz; do
            echo "encrypting legacy $(basename "$legacy")"
            age -r "$BACKUP_AGE_RECIPIENT" -o "$legacy.age" "$legacy"
            rm -f "$legacy"
          done
          shopt -u nullglob

          # Keep only the newest $RETENTION backups. Filenames sort chronologically.
          ls -1 daily/supabase_backup_*.tar.gz.age | sort | head -n -"$RETENTION" | while read -r old; do
            echo "pruning $(basename "$old")"
            rm -f "$old"
          done

          cat > README.md <<'README'
          # VibeVaults production backups

          Nightly logical dumps of the production Supabase database, written by
          `.github/workflows/supabase-backup.yml` in vibe-vaults/VibeVaults.

          **This repository contains personal data** (account emails, auth
          sessions, and customer end-user feedback content). It must stay
          private. Do not fork, mirror, or add collaborators without a DPA in
          place.

          - Layout: `daily/supabase_backup_<UTC timestamp>.tar.gz.age`
          - Every archive is age-encrypted. The private key is held offline by
            the operator and is never stored on GitHub.
          - Retention: newest 30 runs. Each run force-pushes a single orphan
            commit, so pruned backups leave no trace in git history.
          - Restore: `npm run db:rehearse` in the main repo.
          README

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          # Orphan commit + force push: the repo is always exactly the current
          # retention window, with no historical copies of pruned personal data.
          git checkout -q --orphan staging
          git add -A
          git commit -q -m "Backups as of $(date -u +%Y-%m-%dT%H:%M:%SZ) (keeping newest ${RETENTION})"
          git branch -M staging main
          git push -q --force origin main
          echo "pushed. files now retained:"
          ls -1 daily/ | wc -l

      - name: Clean up key material
        if: always()
        run: rm -f ~/.ssh/id_ed25519
